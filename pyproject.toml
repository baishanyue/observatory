[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "observatory"
version = "0.2.0"
description = "A visual workbench for composing, inspecting, and replaying agent and RAG runs."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Observatory contributors" }]
keywords = ["agents", "rag", "observability", "replay", "workbench"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
]
dependencies = []

[project.scripts]
observatory = "observatory.cli:main"

[tool.setuptools]
package-dir = { "" = "." }

[tool.setuptools.packages.find]
where = ["."]
include = ["observatory*"]


[tool.pytest.ini_options]
testpaths = ["tests"]
